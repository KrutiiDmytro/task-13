name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHPUnit + coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # Облікові дані одноразового контейнера, а не секрет: він живе лише
          # під час прогону і назовні не видний
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pixelpulse_test
        ports:
          - 3306:3306
        # Без health-check кроки стартують раніше, ніж MySQL готовий приймати з'єднання
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pixelpulse_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, gd, zip, pdo_mysql, mbstring
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Тести працюють на MySQL із сервісного контейнера (див. phpunit.xml)
      - name: Run tests with coverage
        run: XDEBUG_MODE=coverage php artisan test --coverage-clover reports/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/
          retention-days: 7

  quality:
    name: PHPCS + Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, gd, zip, pdo_mysql, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP CodeSniffer
        run: ./vendor/bin/phpcs --report=full

      - name: Laravel Pint
        run: ./vendor/bin/pint --test

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: tests
    env:
      # Сам сканер читає саме SONAR_TOKEN; ліворуч — імʼя змінної, праворуч — імʼя секрета в репозиторії
      SONAR_TOKEN: ${{ secrets.ACTIONS_TASK_13 }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Sonar потребує повної історії для blame

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: reports/

      # Поки SONAR_TOKEN не доданий у Secrets, крок пропускається і пайплайн лишається зеленим
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: -Dsonar.host.url=https://sonarcloud.io
