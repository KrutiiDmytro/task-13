name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHPUnit + coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, gd, zip, pdo_sqlite, sqlite3, mbstring
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Тести працюють на sqlite :memory: (див. phpunit.xml), окрема БД не потрібна
      - name: Run tests with coverage
        run: XDEBUG_MODE=coverage php artisan test --coverage-clover reports/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/
          retention-days: 7

  quality:
    name: PHPCS + Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, gd, zip, pdo_sqlite, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP CodeSniffer
        run: ./vendor/bin/phpcs --report=full

      - name: Laravel Pint
        run: ./vendor/bin/pint --test

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: tests
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Sonar потребує повної історії для blame

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: reports/

      # Поки SONAR_TOKEN не доданий у Secrets, крок пропускається і пайплайн лишається зеленим
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarcloud-github-action@v4.0.0
