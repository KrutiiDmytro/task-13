# Ключ проекта (ВАЖНО: замените на ваш из SonarCloud)
sonar.projectKey=foxmidedteam_task-13
sonar.organization=foxmidedteam

# Имя и версия проекта
sonar.projectName=Task-13 Laravel Blog
sonar.projectVersion=1.0

# Исходный код
sonar.sources=app,config,routes,database/migrations,database/seeders,database/factories

# Тесты
sonar.tests=tests

# Исключения
sonar.exclusions=\
    **/vendor/**,\
    **/node_modules/**,\
    **/storage/**,\
    **/bootstrap/cache/**,\
    **/public/**,\
    **/*.blade.php,\
    **/lang/**,\
    **/database/migrations/**

sonar.test.exclusions=\
    **/vendor/**

# PHP настройки
sonar.language=php
sonar.php.version=8.2

# Отчёты
sonar.php.coverage.reportPaths=reports/coverage.xml
sonar.php.phpcs.reportPaths=reports/phpcs-report.xml

# Кодировка
sonar.sourceEncoding=UTF-8

# Дополнительно
sonar.scm.provider=git