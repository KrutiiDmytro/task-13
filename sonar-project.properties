# Ключ проекта (из SonarCloud).
sonar.projectKey=KrutiiDmytro_task-13
sonar.organization=krutiidmytro

# Имя и версия проекта
sonar.projectName=Task-13 Laravel Blog
sonar.projectVersion=1.0

# Исходный код
sonar.sources=app,config,routes,database/migrations,database/seeders,database/factories

# Тесты
sonar.tests=tests

# Исключения
sonar.exclusions=\
    **/vendor/**,\
    **/node_modules/**,\
    **/storage/**,\
    **/bootstrap/cache/**,\
    **/public/**,\
    **/*.blade.php,\
    **/lang/**,\
    **/database/migrations/**

sonar.test.exclusions=\
    **/vendor/**

# Исключения из подсчёта покрытия.
# Конфиги, объявления маршрутов, сидеры и фабрики — декларативный код,
# который не покрывается юнит-тестами. Анализ на баги и code smells
# для них продолжает работать: исключается только метрика coverage.
sonar.coverage.exclusions=\
    config/**,\
    routes/**,\
    database/**

# PHP настройки
sonar.language=php
sonar.php.version=8.2

# Отчёты
sonar.php.coverage.reportPaths=reports/coverage.xml
sonar.php.phpcs.reportPaths=reports/phpcs-report.xml

# Кодировка
sonar.sourceEncoding=UTF-8

# Дополнительно
sonar.scm.provider=git