# Используем PHP образ
image: php:8.2

# Определяем стадии пайплайна
stages:
  - test
  - quality
  - sonar

# Глобальный кэш
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - node_modules/

# Переменные окружения
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

# Установка зависимостей перед каждым job
before_script:
  - apt-get update -qq
  - apt-get install -y -qq git curl libzip-dev zip unzip nodejs npm libicu-dev
  - docker-php-ext-configure intl --enable-intl
  - docker-php-ext-install pdo_mysql zip intl
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  - composer install --prefer-dist --no-ansi --no-interaction --no-progress

# Job: Запуск PHPUnit тестов с coverage
phpunit:
  stage: test
  before_script:
  - apt-get update -qq
  - apt-get install -y -qq git curl libzip-dev zip unzip nodejs npm pkg-config libpng-dev libjpeg-dev libfreetype6-dev libicu-dev
  - docker-php-ext-configure gd --with-freetype --with-jpeg
  - docker-php-ext-configure intl --enable-intl
  - docker-php-ext-install pdo_mysql zip gd intl
  - pecl install xdebug
  - docker-php-ext-enable xdebug
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  - composer install --prefer-dist --no-ansi --no-interaction --no-progress
  - npm ci
  - npm run build
  script:
    - php -v
    - cp .env.example .env
    - php artisan key:generate
    - touch database/database.sqlite
    - php artisan migrate --force
    - XDEBUG_MODE=coverage php artisan test --coverage-clover reports/coverage.xml --coverage-html reports/coverage
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    expire_in: 1 week

# Job: PHPCS проверка стандартов кодирования
phpcs:
  stage: quality
  script:
    - ./vendor/bin/phpcs --report=checkstyle --report-file=reports/phpcs-report.xml || true
    - ./vendor/bin/phpcs --report=summary || true
  artifacts:
    paths:
      - reports/phpcs-report.xml
    expire_in: 1 week
  allow_failure: true

# Job: Laravel Pint проверка форматирования
pint:
  stage: quality
  script:
    - ./vendor/bin/pint --test -v
  allow_failure: true

# Job: SonarQube анализ.
sonarcloud:
  stage: sonar
  before_script: []
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  dependencies:
    - phpunit
    - phpcs
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=task-13
      -Dsonar.organization=foxmidedteam
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.sources=app,config,routes,database
      -Dsonar.tests=tests
      -Dsonar.php.coverage.reportPaths=reports/coverage.xml
      -Dsonar.php.phpcs.reportPaths=reports/phpcs-report.xml
      -Dsonar.sourceEncoding=UTF-8
  only:
    - merge_requests
    - master
    - develop