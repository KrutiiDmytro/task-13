# Используем PHP образ
image: php:8.2

# Определяем стадии пайплайна
stages:
  - test
  - quality
  - sonar

# Глобальный кэш
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - node_modules/

# Переменные окружения
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

# Установка зависимостей перед каждым job
before_script:
  - apt-get update -qq
  - apt-get install -y -qq git curl libzip-dev zip unzip nodejs npm
  - docker-php-ext-install pdo_mysql zip
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  - composer install --prefer-dist --no-ansi --no-interaction --no-progress

# Job: Запуск PHPUnit тестов с coverage
phpunit:
  stage: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git curl libzip-dev zip unzip nodejs npm pkg-config libpng-dev libjpeg-dev libfreetype6-dev
    - pecl install pcov
    - docker-php-ext-enable pcov
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install pdo_mysql zip gd
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - npm ci
    - npm run build
  script:
    - php -v
    - cp .env.example .env
    - php artisan key:generate
    - touch database/database.sqlite
    - php artisan migrate --force
    - XDEBUG_MODE=coverage php artisan test --coverage-clover reports/coverage.xml --coverage-html reports/coverage
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    expire_in: 1 week

# Job: PHPCS проверка стандартов кодирования
phpcs:
  stage: quality
  script:
    - ./vendor/bin/phpcs --report=checkstyle --report-file=reports/phpcs-report.xml || true
    - ./vendor/bin/phpcs --report=summary || true
  artifacts:
    paths:
      - reports/phpcs-report.xml
    expire_in: 1 week
  allow_failure: true

# Job: Laravel Pint проверка форматирования
pint:
  stage: quality
  script:
    - ./vendor/bin/pint --test -v
  allow_failure: true

# Job: SonarQube анализ
sonarcloud:
  stage: sonar
  before_script: []
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  dependencies:
    - phpunit
    - phpcs
variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
sonarcloud-check:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - master
    - develop